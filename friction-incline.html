<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friction on Inclined Plane — Class 11 CBSE</title>
<style>
  :root {
    --ink: #0f172a; --muted: #475569; --line: #cbd5e1;
    --green: #16a34a; --amber: #d97706; --red: #dc2626; --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #eef2f7; color: var(--ink); margin: 0; }
  header { background: #1e3a8a; color: #fff; padding: 10px 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { font-size: 12px; margin: 2px 0 0; opacity: 0.9; }
  #wrap { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; max-width: 1180px; margin: 0 auto; }
  #stageBox { flex: 1 1 640px; background: #fff; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
  canvas { display: block; width: 100%; height: 520px; background: #f8fafc; cursor: grab; }
  #panel { flex: 0 1 300px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px; position: sticky; top: 12px; align-self: flex-start; }
  #panel h2 { font-size: 14px; margin: 0 0 8px; }
  .ctl { margin: 10px 0; font-size: 13px; }
  .ctl label { display: flex; justify-content: space-between; font-weight: bold; }
  .badge { background: #dbeafe; color: #1e3a8a; border-radius: 6px; padding: 0 6px; font-weight: normal; }
  input[type=range] { width: 100%; }
  select, button { font-size: 13px; }
  .chk { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; margin: 8px 0; }
  #telemetry { background: #f1f5f9; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #telemetry b { color: #1e3a8a; }
  #playbar { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; background: #fff; border-top: 2px solid var(--line); flex-wrap: wrap; }
  #playbar button, #playbar select { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #f8fafc; cursor: pointer; font-size: 14px; }
  #btnPlay { background: var(--green); color: #fff; border: none; min-width: 110px; }
  #btnReset { background: #64748b; color: #fff; border: none; }
  #hint { font-size: 12px; color: var(--muted); padding: 8px 12px; }
</style>
</head>
<body>
<header>
  <h1>Friction on an Inclined Plane</h1>
  <p>Class 11 CBSE · Newton&apos;s laws &amp; friction · N = mg&middot;cos&theta; · SI units · static vs kinetic friction</p>
</header>
<div id="wrap">
  <div id="stageBox">
    <canvas id="cv" width="900" height="520"></canvas>
    <div id="playbar">
      <button id="btnPlay">⏸ Pause</button>
      <button id="btnStep">Step +Δt</button>
      <select id="selSpeed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1.0×</option>
        <option value="2">2.0×</option>
      </select>
      <button id="btnReset">↺ Reset</button>
    </div>
    <div id="hint">Raise &theta; or lower &mu;<sub>s</sub> until the block slips. Drag the block along the slope to reposition it. Toggle FBD vectors, velocity and trail in the panel.</div>
  </div>
  <div id="panel">
    <h2>Control Panel</h2>
    <div class="ctl">
      <label>Mass m <span class="badge" id="bM">2.0 kg</span></label>
      <input type="range" id="sM" min="0.5" max="5" step="0.1" value="2">
    </div>
    <div class="ctl">
      <label>Incline angle &theta; <span class="badge" id="bTh">25°</span></label>
      <input type="range" id="sTh" min="5" max="45" step="1" value="25">
    </div>
    <div class="ctl">
      <label>Static &mu;<sub>s</sub> <span class="badge" id="bMus">0.40</span></label>
      <input type="range" id="sMus" min="0" max="1" step="0.01" value="0.4">
    </div>
    <div class="ctl">
      <label>Kinetic &mu;<sub>k</sub> <span class="badge" id="bMuk">0.30</span></label>
      <input type="range" id="sMuk" min="0" max="1" step="0.01" value="0.3">
    </div>
    <div class="ctl">
      <label>Scenario preset</label>
      <select id="selPreset">
        <option value="wood">Wood on wood (0.40 / 0.30)</option>
        <option value="ice">Ice — nearly frictionless (0.05 / 0.03)</option>
        <option value="rubber">Rubber on concrete (0.90 / 0.70)</option>
        <option value="steep">Steep slip (&theta; = 40°)</option>
      </select>
    </div>
    <div class="chk">
      <label><input type="checkbox" id="cGrid" checked> Grid</label>
      <label><input type="checkbox" id="cFBD" checked> FBD vectors</label>
      <label><input type="checkbox" id="cV" checked> Velocity</label>
      <label><input type="checkbox" id="cTrail" checked> Trail</label>
    </div>
    <div id="telemetry">—</div>
  </div>
</div>
<script>
'use strict';
/* Block on incline: static/kinetic friction, fixed-step physics, SI units. */
const DT = 0.0166;
const G = 9.81;               // m/s^2
const L = 5.0;                // slope length (m), x measured down from top
const V_EPS = 0.02;           // m/s, rest threshold
const F2PX = 2.4;             // px per newton for force arrows
const FMAX = 130;             // px clamp for force arrows

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1;
function fitCanvas() {
  DPR = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(300, Math.round(r.width * DPR));
  cv.height = Math.round(520 * DPR);
}
window.addEventListener('resize', fitCanvas);

const S = {
  running: true, speed: 1, acc: 0, last: performance.now(),
  t: 0,
  m: 2.0, theta: 25, mus: 0.4, muk: 0.3,
  x: 0, v: 0, a: 0, N: 0, fr: 0, mode: 'STATIC',
  dragging: false,
  trail: [],
  showGrid: true, showFBD: true, showV: true, showTrail: true
};

function rad() { return S.theta * Math.PI / 180; }
function forces() {
  const th = rad();
  const N = S.m * G * Math.cos(th);
  const drive = S.m * G * Math.sin(th);
  return { th: th, N: N, drive: drive, fsMax: S.mus * N };
}
function stepPhysics(dt) {
  S.t += dt;
  const f = forces();
  if (Math.abs(S.v) < V_EPS && f.drive <= f.fsMax + 1e-9) {
    // static: friction exactly cancels drive
    S.v = 0; S.a = 0; S.N = f.N; S.fr = f.drive; S.mode = 'STATIC';
  } else {
    // kinetic: friction magnitude muk*N opposes velocity (or impending downslope motion)
    const s = Math.abs(S.v) > 1e-9 ? Math.sign(S.v) : 1;
    const fk = S.muk * f.N;
    const a = (f.drive - s * fk) / S.m;
    S.v += a * dt;
    // re-stick: passed through zero while static friction can hold
    if (s !== 0 && Math.sign(S.v) !== s && f.drive <= f.fsMax + 1e-9 && Math.abs(S.v) < 0.35) {
      S.v = 0; S.a = 0; S.N = f.N; S.fr = f.drive; S.mode = 'STATIC';
    } else {
      S.a = a; S.N = f.N; S.fr = fk; S.mode = 'SLIDING';
    }
  }
  S.x += S.v * dt;
  if (S.x >= L) { S.x = L; S.v = 0; S.a = 0; S.mode = 'AT BOTTOM'; }
  if (S.x <= 0) {
    S.x = 0;
    if (S.v < 0) {
      const f2 = forces();
      if (f2.drive <= S.mus * f2.N + 1e-9) { S.v = 0; S.a = 0; S.fr = f2.drive; S.N = f2.N; S.mode = 'STATIC'; }
      else { S.v = 0; }
    }
  }
  if (S.showTrail && Math.abs(S.v) > 0.05 && S.mode === 'SLIDING') {
    S.trail.push({ x: S.x });
    if (S.trail.length > 150) S.trail.shift();
  }
}

/* ---- coordinates ---- */
function W() { return cv.width / DPR; }
function H() { return cv.height / DPR; }
function PXM() {
  const th = rad(), c = Math.cos(th), s = Math.sin(th);
  let p = 90;
  p = Math.min(p, (W() - 160) / (L * c));
  p = Math.min(p, (H() - 260) / (L * s + 0.02));
  return Math.max(28, p);
}
function slopeGeom() {
  const th = rad(), pxm = PXM();
  const bx = W() - 70, by = H() - 130;
  const ax = bx - L * pxm * Math.cos(th);
  const ay = by - L * pxm * Math.sin(th);
  return { ax: ax, ay: ay, bx: bx, by: by, cx: ax, cy: by, pxm: pxm, th: th };
}
function surfPoint(xm) {
  const g = slopeGeom();
  return {
    x: g.ax + xm * g.pxm * Math.cos(g.th),
    y: g.ay + xm * g.pxm * Math.sin(g.th),
    g: g
  };
}
function blockCenter(xm) {
  const p = surfPoint(xm), th = rad();
  const off = 20;
  return { x: p.x + Math.sin(th) * off, y: p.y - Math.cos(th) * off };
}
function arrow(x, y, dx, dy, color, lw, dashed) {
  const len = Math.hypot(dx, dy);
  if (len < 2) return;
  const ux = dx / len, uy = dy / len;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw || 3;
  if (dashed) ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  ctx.setLineDash([]);
  const h = 9;
  ctx.beginPath();
  ctx.moveTo(x + dx, y + dy);
  ctx.lineTo(x + dx - ux * h - uy * 4, y + dy - uy * h + ux * 4);
  ctx.lineTo(x + dx - ux * h + uy * 4, y + dy - uy * h - ux * 4);
  ctx.fill();
}

/* ---- input: drag block along slope ---- */
function ptr(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', (e) => {
  const p = ptr(e), c = blockCenter(S.x);
  if (Math.hypot(p.x - c.x, p.y - c.y) < 46) {
    S.dragging = true;
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!S.dragging) return;
  const p = ptr(e), g = slopeGeom();
  const dx = p.x - g.ax, dy = p.y - g.ay;
  const along = (dx * Math.cos(g.th) + dy * Math.sin(g.th)) / g.pxm;
  S.x = Math.max(0, Math.min(L, along));
  S.v = 0;
});
function endDrag() { S.dragging = false; cv.style.cursor = 'grab'; }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---- render ---- */
function drawGrid() {
  if (!S.showGrid) return;
  ctx.save(); ctx.scale(DPR, DPR);
  ctx.strokeStyle = 'rgba(15,23,42,0.07)'; ctx.lineWidth = 1;
  for (let x = 0; x < W(); x += 26) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H()); ctx.stroke(); }
  for (let y = 0; y < H(); y += 26) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W(), y); ctx.stroke(); }
  ctx.restore();
}
function drawSlope() {
  ctx.save(); ctx.scale(DPR, DPR);
  const g = slopeGeom();
  // wedge
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath();
  ctx.moveTo(g.ax, g.ay); ctx.lineTo(g.bx, g.by); ctx.lineTo(g.cx, g.cy);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(g.cx, g.cy); ctx.stroke();
  // ground
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(14, g.by); ctx.lineTo(W() - 10, g.by); ctx.stroke();
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
  for (let hx = 24; hx < W() - 12; hx += 18) {
    ctx.beginPath(); ctx.moveTo(hx, g.by + 2); ctx.lineTo(hx - 9, g.by + 12); ctx.stroke();
  }
  // surface
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(g.bx, g.by); ctx.stroke();
  // angle arc at bottom vertex
  const rA = 46;
  ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(g.bx, g.by, rA, Math.PI, Math.PI + g.th, false); ctx.stroke();
  ctx.fillStyle = '#1e3a8a'; ctx.font = 'bold 14px Arial';
  const mid = Math.PI + g.th / 2;
  ctx.fillText('θ=' + S.theta + '°', g.bx + Math.cos(mid) * (rA + 26) - 14, g.by + Math.sin(mid) * (rA + 26) + 5);
  // labels
  ctx.fillStyle = '#475569'; ctx.font = '12px Arial';
  const hgt = (L * Math.sin(g.th)).toFixed(1);
  ctx.fillText('L = ' + L.toFixed(1) + ' m (along slope)', (g.ax + g.bx) / 2 - 60, (g.ay + g.by) / 2 + 22);
  ctx.fillText('h = ' + hgt + ' m', g.ax - 8, (g.ay + g.by) / 2);
  ctx.fillText('μs=' + S.mus.toFixed(2) + '  μk=' + S.muk.toFixed(2), g.ax - 6, g.ay - 10);
  ctx.restore();
}
function drawBlock() {
  ctx.save(); ctx.scale(DPR, DPR);
  const th = rad();
  // trail breadcrumbs along surface
  if (S.showTrail) {
    ctx.fillStyle = 'rgba(217,119,6,0.35)';
    for (const p of S.trail) {
      const s = surfPoint(p.x);
      ctx.beginPath(); ctx.arc(s.x, s.y - 4, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  const c = blockCenter(S.x);
  const BW = 52, BH = 36;
  // body rotated to sit on slope
  ctx.save();
  ctx.translate(c.x, c.y); ctx.rotate(th);
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(-BW / 2, -BH / 2, BW, BH);
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
  ctx.strokeRect(-BW / 2, -BH / 2, BW, BH);
  ctx.restore();
  if (S.dragging) {
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.strokeRect(c.x - BW / 2 - 6, c.y - BH / 2 - 6, BW + 12, BH + 12);
    ctx.setLineDash([]);
  }
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Arial';
  ctx.fillText('m=' + S.m.toFixed(1) + 'kg', c.x - 26, c.y - 26);

  const mg = S.m * G;
  const f = forces();
  const down = { x: Math.cos(th), y: Math.sin(th) };       // downslope unit
  const out = { x: Math.sin(th), y: -Math.cos(th) };       // slope normal, outward
  const scl = function (F) { return Math.min(FMAX, F * F2PX); };
  ctx.font = '12px Arial';

  if (S.showFBD) {
    // weight straight down (red)
    arrow(c.x, c.y, 0, scl(mg), '#dc2626', 4, false);
    ctx.fillStyle = '#dc2626';
    ctx.fillText('mg=' + mg.toFixed(1) + 'N', c.x + 8, c.y + scl(mg) / 2 + 10);
    // normal perpendicular outward (blue)
    const lN = scl(f.N);
    arrow(c.x, c.y, out.x * lN, out.y * lN, '#2563eb', 4, false);
    ctx.fillStyle = '#2563eb';
    ctx.fillText('N=' + f.N.toFixed(1) + 'N', c.x + out.x * (lN + 10) - 12, c.y + out.y * (lN + 10));
    // friction along slope opposing motion (amber)
    const sgn = Math.abs(S.v) > V_EPS ? -Math.sign(S.v) : -1;
    const lF = scl(S.fr);
    arrow(c.x, c.y, down.x * sgn * lF, down.y * sgn * lF, '#d97706', 4, false);
    ctx.fillStyle = '#d97706';
    const fl = (S.mode === 'STATIC' ? 'fs=' : 'fk=') + S.fr.toFixed(1) + 'N';
    ctx.fillText(fl, c.x + down.x * sgn * (lF + 12) - 14, c.y + down.y * sgn * (lF + 12) - 6);
    // weight components (dashed red)
    const lPar = scl(mg * Math.sin(th)), lPer = scl(mg * Math.cos(th));
    arrow(c.x, c.y, down.x * lPar, down.y * lPar, '#dc2626', 2, true);
    arrow(c.x, c.y, -out.x * lPer, -out.y * lPer, '#dc2626', 2, true);
    ctx.fillStyle = '#dc2626';
    ctx.fillText('mg·sinθ', c.x + down.x * (lPar + 8) - 10, c.y + down.y * (lPar + 8) + 12);
    ctx.fillText('mg·cosθ', c.x - out.x * (lPer + 8) - 44, c.y - out.y * (lPer + 8) + 4);
    // net / acceleration along slope (dark amber, dashed)
    if (Math.abs(S.a) > 0.05) {
      const lA = Math.max(14, Math.min(100, Math.abs(S.a) * 12));
      const sa = Math.sign(S.a);
      arrow(c.x, c.y, down.x * sa * lA, down.y * sa * lA, '#b45309', 3, true);
      ctx.fillStyle = '#b45309';
      ctx.fillText('a=' + S.a.toFixed(2), c.x + down.x * sa * (lA + 10) - 10, c.y + down.y * sa * (lA + 10) + 12);
    }
  }
  // velocity along slope (green)
  if (S.showV && Math.abs(S.v) > V_EPS) {
    const lV = Math.max(16, Math.min(120, Math.abs(S.v) * 40));
    const sv = Math.sign(S.v);
    arrow(c.x, c.y - 30, down.x * sv * lV, down.y * sv * lV, '#16a34a', 4, false);
    ctx.fillStyle = '#16a34a';
    ctx.fillText('v=' + S.v.toFixed(2) + ' m/s', c.x + down.x * sv * lV + 6, c.y - 30 + down.y * sv * lV);
  }
  // state badge
  ctx.font = 'bold 13px Arial';
  const col = S.mode === 'STATIC' ? '#2563eb' : (S.mode === 'SLIDING' ? '#d97706' : '#16a34a');
  ctx.fillStyle = col;
  ctx.fillText(S.mode === 'STATIC' ? '● STATIC (fs holds)' : (S.mode === 'SLIDING' ? '● SLIDING (kinetic)' : '● ' + S.mode), 12, 20);
  // legend
  ctx.font = '12px Arial'; ctx.fillStyle = '#475569';
  ctx.fillText('— mg (red) · N (blue) · friction (amber) · v (green) · a (dashed amber)', 12, H() - 108);
  ctx.restore();
}
function telemetry() {
  const el = document.getElementById('telemetry');
  const f = forces();
  const th = rad();
  const hgt = (L - S.x) * Math.sin(th);
  const KE = 0.5 * S.m * S.v * S.v;
  const PE = S.m * G * hgt;
  const fricLabel = S.mode === 'STATIC' ? 'fs' : 'fk';
  el.innerHTML =
    't = <b>' + S.t.toFixed(2) + ' s</b> · <b>' + S.mode + '</b><br>' +
    'N = mg·cosθ = <b>' + S.N.toFixed(2) + ' N</b><br>' +
    'friction ' + fricLabel + ' = <b>' + S.fr.toFixed(2) + ' N</b>' +
    ' (μsN = ' + (S.mus * S.N).toFixed(2) + ' N)<br>' +
    'drive mg·sinθ = <b>' + f.drive.toFixed(2) + ' N</b><br>' +
    'a = <b>' + S.a.toFixed(2) + ' m/s²</b> · v = <b>' + S.v.toFixed(2) + ' m/s</b><br>' +
    'x along slope = <b>' + S.x.toFixed(2) + ' m</b> / ' + L.toFixed(1) + ' m<br>' +
    'KE = <b>' + KE.toFixed(2) + ' J</b> · PE = mgh = <b>' + PE.toFixed(2) + ' J</b>';
}
function frame(now) {
  let fdt = Math.min(0.1, (now - S.last) / 1000);
  S.last = now;
  if (S.running) {
    S.acc += fdt * S.speed;
    let n = 0;
    while (S.acc >= DT && n < 8) { stepPhysics(DT); S.acc -= DT; n++; }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawGrid(); drawSlope(); drawBlock();
  telemetry();
  requestAnimationFrame(frame);
}

/* ---- UI wiring ---- */
const $ = (id) => document.getElementById(id);
$('sM').oninput = (e) => { S.m = +e.target.value; $('bM').textContent = S.m.toFixed(1) + ' kg'; };
$('sTh').oninput = (e) => { S.theta = +e.target.value; $('bTh').textContent = S.theta + '°'; };
$('sMus').oninput = (e) => {
  S.mus = +e.target.value;
  if (S.muk > S.mus) {
    S.muk = S.mus;
    $('sMuk').value = S.muk; $('bMuk').textContent = S.muk.toFixed(2);
  }
  $('bMus').textContent = S.mus.toFixed(2);
};
$('sMuk').oninput = (e) => {
  S.muk = Math.min(+e.target.value, S.mus);   // clamp μk ≤ μs
  $('sMuk').value = S.muk;
  $('bMuk').textContent = S.muk.toFixed(2);
};
$('cGrid').onchange = (e) => { S.showGrid = e.target.checked; };
$('cFBD').onchange = (e) => { S.showFBD = e.target.checked; };
$('cV').onchange = (e) => { S.showV = e.target.checked; };
$('cTrail').onchange = (e) => { S.showTrail = e.target.checked; if (!S.showTrail) S.trail = []; };
function applyPreset(m, th, mus, muk) {
  S.m = m; S.theta = th; S.mus = mus; S.muk = Math.min(muk, mus);
  $('sM').value = m; $('sTh').value = th; $('sMus').value = mus; $('sMuk').value = S.muk;
  $('bM').textContent = m.toFixed(1) + ' kg';
  $('bTh').textContent = th + '°';
  $('bMus').textContent = mus.toFixed(2);
  $('bMuk').textContent = S.muk.toFixed(2);
  S.x = 0; S.v = 0; S.a = 0; S.t = 0; S.trail = []; S.acc = 0;
}
$('selPreset').onchange = (e) => {
  const v = e.target.value;
  if (v === 'ice') applyPreset(2, 15, 0.05, 0.03);
  if (v === 'wood') applyPreset(2, 25, 0.4, 0.3);
  if (v === 'rubber') applyPreset(2, 25, 0.9, 0.7);
  if (v === 'steep') applyPreset(3, 40, 0.4, 0.3);
};
$('btnPlay').onclick = (e) => {
  S.running = !S.running;
  e.target.textContent = S.running ? '⏸ Pause' : '▶ Play';
};
$('btnStep').onclick = () => { S.running = false; $('btnPlay').textContent = '▶ Play'; stepPhysics(DT); };
$('selSpeed').onchange = (e) => { S.speed = +e.target.value; };
$('btnReset').onclick = () => {
  Object.assign(S, { t: 0, x: 0, v: 0, a: 0, trail: [], acc: 0 });
  S.running = true; $('btnPlay').textContent = '⏸ Pause';
};

fitCanvas();
requestAnimationFrame((t) => { S.last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
